name: Verificar hoja de Google
on: push
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar la página publicada y el código de Google (solo lectura)
        run: |
          P='https://danielvillamorales.github.io/almuerzos'
          echo "=== config.js publicado"
          curl -sS "$P/config.js?t=$(date +%s)" | grep ALMUERZOS
          echo "=== index.html publicado: campo cantidad y versión de la página"
          curl -sS "$P/?t=$(date +%s)" | grep -c 'id="qtyRow"'
          curl -sS "$P/?t=$(date +%s)" | grep -c 'async function prefetch'
          echo "=== caché del navegador"
          curl -sSI "$P/config.js" | grep -i -E '^(cache-control|last-modified|age):'
          for U in 'https://script.google.com/macros/s/AKfycbxsL9oCvYci5HQauzTMXRnr0lrxMZP67K1bdL6f43u8jVo2X7PKSgZAQXQzMBWxB9-3Sg/exec' 'https://script.google.com/macros/s/AKfycbwOQRt6n3OIn7qTmeDtEh6obharjy8Ko1prNdoECzVllwMfL3At_eJfwhIFN9SiIM8BdA/exec'; do
            echo "=== ping ${U:40:20}"
            curl -sS -L "$U" | head -c 300; echo
          done
          echo "=== pedidos del 2026-10-09 (nueva URL)"
          curl -sS -L 'https://script.google.com/macros/s/AKfycbxsL9oCvYci5HQauzTMXRnr0lrxMZP67K1bdL6f43u8jVo2X7PKSgZAQXQzMBWxB9-3Sg/exec?action=list&fecha=2026-10-09&desde=2026-10-08' | head -c 1500; echo
