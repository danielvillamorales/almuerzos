<title>Pedido de almuerzos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una sola tarjeta blanca sobre fondo durazno — fecha, tabla Nombre/Pedido/Hora, totales */
:root {
  --bg-a: #fdf3ea;
  --bg-b: #fbd9bf;
  --card: #ffffff;
  --fg: #1f1b18;
  --muted: #8f8a86;
  --line: #ece8e4;
  --accent: #ef6c1a;
  --accent-2: #f7913f;
  --ok: #2e8b3e;
  --ok-soft: #e8f7ec;
  --warn: #d4500f;
  --warn-soft: #fdeee3;
  --dark-tile: #221e1b;
  --dark-tile-fg: #ffffff;
  --soft: #f7f4f1;
  --danger: #c62828;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #16110e; --bg-b: #2a1a10; --card: #1f1a17; --fg: #f5efea; --muted: #a29a94; --line: #352d28;
    --ok: #74d488; --ok-soft: #1b3122; --warn: #ffa36a; --warn-soft: #3a2418;
    --dark-tile: #f5efea; --dark-tile-fg: #1f1b18; --soft: #2a2420; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-a: #16110e; --bg-b: #2a1a10; --card: #1f1a17; --fg: #f5efea; --muted: #a29a94; --line: #352d28;
  --ok: #74d488; --ok-soft: #1b3122; --warn: #ffa36a; --warn-soft: #3a2418;
  --dark-tile: #f5efea; --dark-tile-fg: #1f1b18; --soft: #2a2420; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  min-height: 100%;
  background: var(--bg-a);
  background-image: radial-gradient(120% 80% at 100% 100%, var(--bg-b), transparent 60%), radial-gradient(90% 60% at 0% 0%, var(--bg-b), transparent 55%);
  background-attachment: fixed;
  color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.35;
  padding-block: 28px 40px; padding-inline: 16px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card {
  max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 32px;
  padding: 28px clamp(16px, 5vw, 28px) 28px;
  box-shadow: 0 2px 4px rgba(120,60,20,.04), 0 24px 60px rgba(160,80,30,.10);
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; align-items: center; gap: 16px; }
.logo {
  width: 64px; height: 64px; border-radius: 18px; flex: none; display: grid; place-items: center; color: #fff;
  background: linear-gradient(160deg, var(--accent-2), var(--accent));
  box-shadow: 0 10px 24px rgba(239,108,26,.32);
}
h1 { font-size: clamp(22px, 6vw, 28px); font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1.1; text-wrap: balance; }
.sub { color: var(--muted); font-size: 16px; margin-top: 4px; }

/* Fecha */
.datebar { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 16px; padding: 8px; }
.nav { width: 38px; height: 38px; border-radius: 12px; border: none; background: var(--card); display: grid; place-items: center; flex: none; color: var(--muted); }
.datebox { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
.datebox .k { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.datebox .day { font-weight: 700; font-size: 16px; text-align: center; }
.datebox .day::first-letter { text-transform: uppercase; }
.datebox input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

/* Tabla */
.cols, .row { display: grid; grid-template-columns: minmax(0,1fr) auto 78px; column-gap: 12px; align-items: center; }
.cols { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 4px 4px 12px; border-bottom: 1.5px solid var(--line); }
.cols span:nth-child(2) { min-width: 104px; }
.cols span:last-child { text-align: right; }
ul.list { list-style: none; margin: 0; padding: 0; }
li { border-bottom: 1px solid var(--line); }
.row { padding: 14px 4px; }
.who { display: flex; align-items: center; gap: 14px; min-width: 0; border: none; background: none; padding: 0; text-align: left; }
.avatar { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 17px; position: relative; }
.avatar .chk { position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; border: 2px solid var(--card); display: grid; place-items: center; }
.who .nm { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; display: block; }
.who .note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; display: block; }
.pill { border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; min-width: 104px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.s { background: var(--ok-soft); color: var(--ok); }
.pill.d { background: var(--warn-soft); color: var(--warn); }
.time { justify-self: end; display: inline-flex; align-items: center; gap: 7px; color: var(--fg); opacity: .78; font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.time svg { color: var(--muted); }
.time.none { color: var(--muted); opacity: .6; padding-right: 14px; }

.pay { margin-top: 3px; border: none; background: none; padding: 0; font-size: 12.5px; font-weight: 600; color: var(--warn); display: inline-flex; gap: 4px; align-items: center; }
.pay.yes { color: var(--ok); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 4px 14px 64px; }
.actions button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.actions .danger { color: var(--danger); border-color: transparent; background: none; }
.actions .confirm { background: var(--danger); color: #fff; border-color: var(--danger); }

.empty { text-align: center; color: var(--muted); padding: 32px 8px; border-bottom: 1px solid var(--line); }
.empty b { color: var(--fg); display: block; font-size: 16px; margin-bottom: 4px; }

/* Agregar */
.addbtn { width: 100%; border: 1.5px dashed var(--line); background: none; border-radius: 16px; padding: 14px; font-weight: 600; color: var(--accent); }
form.add { display: flex; flex-direction: column; gap: 10px; background: var(--soft); border-radius: 18px; padding: 14px; }
.field { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px; min-width: 0; width: 100%; font-size: 16px; }
.frow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: none; background: transparent; padding: 8px 14px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"][data-v="Sencilla"] { background: var(--ok-soft); color: var(--ok); }
.seg button[aria-pressed="true"][data-v="Doble"] { background: var(--warn-soft); color: var(--warn); }
#time { width: 120px; }
.primary { border: none; background: var(--accent); color: #fff; font-weight: 700; padding: 11px 18px; border-radius: 12px; }
.primary:disabled { opacity: .5; cursor: default; }
.linkbtn { border: none; background: none; color: var(--muted); font-weight: 600; padding: 8px; }

/* Totales */
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { border-radius: 22px; padding: 16px 18px 14px; min-width: 0; }
.tile .n { font-size: clamp(30px, 9vw, 42px); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .l { font-weight: 500; margin-top: 8px; font-size: 15px; }
.tile.s { background: var(--ok-soft); color: var(--ok); }
.tile.d { background: var(--warn-soft); color: var(--warn); }
.tile.t { background: var(--dark-tile); color: var(--dark-tile-fg); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.foot b { color: var(--fg); }
.status { font-size: 13px; color: var(--muted); text-align: center; }
.status:empty { display: none; }
.status.err { color: var(--danger); }
@media (prefers-reduced-motion: no-preference) { li { animation: in .2s ease-out both; } @keyframes in { from { opacity: .3; } } }
</style>

<main class="card">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v6a2 2 0 0 0 2 2v10M9 3v6a2 2 0 0 1-2 2M7 3v5M17 21V3c-2.2 1-3.5 4-3.5 7.5S14.8 14 17 14"/></svg>
    </div>
    <div>
      <h1>Pedido de almuerzos</h1>
      <div class="sub" id="count">Cargando…</div>
    </div>
  </header>

  <div class="datebar">
    <button class="nav" id="prev" aria-label="Día anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <label class="datebox">
      <span class="k">Fecha del pedido</span>
      <span class="day" id="dayLabel"></span>
      <input type="date" id="date" aria-label="Seleccionar fecha del pedido">
    </label>
    <button class="nav" id="next" aria-label="Día siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <section>
    <div class="cols"><span>Nombre</span><span>Pedido</span><span>Hora</span></div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty"><b>No hay pedidos para esta fecha</b>Toca “Agregar pedido” para anotar el primero.</div>
  </section>

  <button class="addbtn" id="openAdd">+ Agregar pedido</button>
  <form class="add" id="addForm" autocomplete="off" hidden>
    <input class="field" id="name" placeholder="Nombre" maxlength="40" required>
    <div class="frow">
      <div class="seg" role="group" aria-label="Tipo de almuerzo">
        <button type="button" data-v="Sencilla" aria-pressed="true">Sencilla</button>
        <button type="button" data-v="Doble" aria-pressed="false">Doble</button>
      </div>
      <input class="field" type="time" id="time" value="12:30" aria-label="Hora">
    </div>
    <input class="field" id="note" placeholder="Nota opcional (sin arroz, para llevar…)" maxlength="80">
    <div class="frow" style="justify-content:flex-end">
      <button type="button" class="linkbtn" id="closeAdd">Cerrar</button>
      <button class="primary" id="addBtn" type="submit">Agregar</button>
    </div>
  </form>

  <div class="totals">
    <div class="tile s"><div class="n" id="tS">0</div><div class="l">Sencillas</div></div>
    <div class="tile d"><div class="n" id="tD">0</div><div class="l">Dobles</div></div>
    <div class="tile t"><div class="n" id="tT">0</div><div class="l">Total</div></div>
  </div>

  <div class="foot">
    <span id="paidLine">Pagaron <b>0</b> de 0</span>
    <button class="linkbtn" id="copy">Copiar resumen</button>
  </div>
  <div class="status" id="status" role="status"></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fromKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => toKey(new Date());
  const CLOCK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const CHECK = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

  const PALETTE = [
    ["#fde6d2", "#c4500f"], ["#d8f5de", "#2e8b3e"], ["#d6eafc", "#1f6fc4"], ["#e6defd", "#6a43c9"],
    ["#fde0ea", "#c42659"], ["#fdf1c2", "#a86a00"], ["#d0f6ea", "#1d8a6a"], ["#fde0e0", "#c62828"]
  ];
  const colorFor = (name) => { let h = 0; for (const c of name.toLowerCase()) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };

  let db = null, canWrite = true, unsub = null;
  let date = todayKey();
  let orders = [];
  let kind = "Sencilla";
  let openRow = null, confirmDel = false;

  const setStatus = (msg, err) => { const s = $("status"); s.textContent = msg || ""; s.classList.toggle("err", !!err); };
  const dayText = () => fromKey(date).toLocaleDateString("es-CO", { weekday: "long", day: "numeric", month: "long" });

  function renderDate() {
    $("date").value = date;
    $("dayLabel").textContent = (date === todayKey() ? "Hoy, " : "") + dayText();
  }

  function render() {
    const list = $("list");
    list.textContent = "";
    for (const o of orders) {
      const li = document.createElement("li");
      const [bg, fg] = colorFor(o.name || "?");
      li.innerHTML = `
        <div class="row">
          <button class="who" aria-label="Opciones del pedido">
            <span class="avatar"></span>
            <span style="min-width:0"><span class="nm"></span><span class="note"></span></span>
          </button>
          <span class="pill"></span>
          <span class="time"></span>
        </div>`;
      const av = li.querySelector(".avatar");
      av.style.background = bg; av.style.color = fg;
      av.textContent = (o.name || "?").trim().charAt(0).toUpperCase();
      if (o.paid) av.insertAdjacentHTML("beforeend", `<span class="chk">${CHECK}</span>`);
      li.querySelector(".nm").textContent = o.name;
      const note = li.querySelector(".note");
      note.textContent = o.note || ""; note.hidden = !o.note;
      const textBox = note.parentElement;
      const pay = document.createElement("span");
      pay.className = "pay" + (o.paid ? " yes" : "");
      pay.textContent = o.paid ? "Pagó" : "Sin pagar";
      textBox.appendChild(pay);
      const pill = li.querySelector(".pill");
      pill.textContent = o.type;
      pill.classList.add(o.type === "Doble" ? "d" : "s");
      const t = li.querySelector(".time");
      if (o.time) t.innerHTML = CLOCK + `<span>${o.time.replace(/[^0-9:]/g, "")}</span>`;
      else { t.textContent = "—"; t.classList.add("none"); }

      li.querySelector(".who").onclick = () => {
        if (!canWrite) return;
        openRow = openRow === o.id ? null : o.id; confirmDel = false; render();
      };

      if (openRow === o.id) {
        const a = document.createElement("div");
        a.className = "actions";
        if (!confirmDel) {
          const bPay = document.createElement("button");
          bPay.textContent = o.paid ? "Marcar sin pagar" : "✓ Marcar pagó";
          bPay.onclick = () => { openRow = null; write(o.id, { ...o, paid: !o.paid }); };
          const bType = document.createElement("button");
          bType.textContent = "Cambiar a " + (o.type === "Doble" ? "Sencilla" : "Doble");
          bType.onclick = () => { openRow = null; write(o.id, { ...o, type: o.type === "Doble" ? "Sencilla" : "Doble" }); };
          const bDel = document.createElement("button");
          bDel.className = "danger"; bDel.textContent = "Borrar";
          bDel.onclick = () => { confirmDel = true; render(); };
          a.append(bPay, bType, bDel);
        } else {
          const q = document.createElement("span");
          q.textContent = "¿Borrar el pedido de " + o.name + "?"; q.style.cssText = "align-self:center;font-size:13px;font-weight:600";
          const no = document.createElement("button"); no.textContent = "No";
          no.onclick = () => { confirmDel = false; render(); };
          const yes = document.createElement("button"); yes.className = "confirm"; yes.textContent = "Sí, borrar";
          yes.onclick = () => remove(o.id);
          a.append(q, no, yes);
        }
        li.appendChild(a);
      }
      list.appendChild(li);
    }
    $("empty").hidden = orders.length > 0;

    const s = orders.filter(o => o.type !== "Doble").length;
    $("tS").textContent = s; $("tD").textContent = orders.length - s; $("tT").textContent = orders.length;
    if (db) $("count").textContent = `${orders.length} ${orders.length === 1 ? "pedido" : "pedidos"}`;
    const paid = orders.filter(o => o.paid).length;
    $("paidLine").innerHTML = `Pagaron <b>${paid}</b> de ${orders.length}`;
  }

  function subscribe() {
    if (unsub) unsub();
    orders = []; openRow = null; render();
    if (!db) return;
    $("count").textContent = "Cargando…";
    unsub = db.collection("orders").where("date", "==", date).onSnapshot(
      (snap) => {
        orders = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        render();
      },
      () => setStatus("Se perdió la conexión. Recarga la página.", true)
    );
  }

  const clean = ({ id, ...rest }) => rest;
  async function write(id, o) {
    try { await db.collection("orders").doc(id).set(clean(o)); setStatus(""); } catch (e) { onErr(e); }
    render();
  }
  async function remove(id) {
    openRow = null; confirmDel = false;
    try { await db.collection("orders").doc(id).delete(); } catch (e) { onErr(e); }
    render();
  }
  function onErr(e) {
    if (e && e.code === "invalid_argument") { canWrite = false; applyWrite(); setStatus("Puedes ver los pedidos, pero no anotar. Pídele al dueño acceso de Editor.", true); }
    else if (e && e.code === "quota_exceeded") setStatus("Se llenó el espacio. Borra pedidos de días viejos.", true);
    else setStatus("No se pudo guardar. Revisa tu conexión e intenta de nuevo.", true);
  }
  function applyWrite() {
    $("openAdd").hidden = !canWrite || !$("addForm").hidden;
    if (!canWrite) $("addForm").hidden = true;
    render();
  }

  const go = (k) => { date = k; renderDate(); subscribe(); };
  const shift = (n) => { const d = fromKey(date); d.setDate(d.getDate() + n); go(toKey(d)); };
  $("prev").onclick = () => shift(-1);
  $("next").onclick = () => shift(1);
  $("date").onchange = (e) => { if (e.target.value) go(e.target.value); };
  $("date").onclick = (e) => { try { e.target.showPicker && e.target.showPicker(); } catch (_) {} };

  $("openAdd").onclick = () => { $("addForm").hidden = false; $("openAdd").hidden = true; $("name").focus(); };
  $("closeAdd").onclick = () => { $("addForm").hidden = true; $("openAdd").hidden = !canWrite; };
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    kind = b.dataset.v;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("name").value.trim();
    if (!name) return;
    if (!db) { setStatus("Abre el enlace con tu cuenta de Claude para anotar pedidos.", true); return; }
    const btn = $("addBtn"); btn.disabled = true;
    try {
      await db.collection("orders").doc().set({
        date, name, type: kind, time: $("time").value || "", note: $("note").value.trim(), paid: false, createdAt: Date.now()
      });
      $("name").value = ""; $("note").value = ""; $("name").focus(); setStatus("");
    } catch (err) { onErr(err); }
    btn.disabled = false;
  });

  $("copy").onclick = () => {
    const s = orders.filter(o => o.type !== "Doble").length;
    const lines = [`Almuerzos ${dayText()}`, ""];
    orders.forEach((o, i) => lines.push(`${i + 1}. ${o.name} — ${o.type}${o.time ? " " + o.time : ""}${o.note ? " (" + o.note + ")" : ""}${o.paid ? " ✓" : ""}`));
    lines.push("", `Sencillas: ${s} · Dobles: ${orders.length - s} · Total: ${orders.length}`);
    const owe = orders.filter(o => !o.paid).map(o => o.name);
    if (owe.length) lines.push(`Faltan por pagar: ${owe.join(", ")}`);
    navigator.clipboard.writeText(lines.join("\n")).then(
      () => setStatus("Resumen copiado. Pégalo en WhatsApp."),
      () => setStatus("No se pudo copiar automáticamente.", true));
  };

  renderDate();
  render();

  (async () => {
    db = await (window.claude?.use?.("db") ?? null);
    if (!db) {
      $("count").textContent = "Inicia sesión en Claude para ver los pedidos";
      $("openAdd").hidden = true;
      return;
    }
    const user = await (window.claude?.use?.("user") ?? null);
    const w = user ? await user.can("data.write") : null;
    if (w === false) canWrite = false;
    applyWrite();
    subscribe();
  })();
})();
</script>
